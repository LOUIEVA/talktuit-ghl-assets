/*
 * TalkTuit GHL Customizer
 * Brand system: TalkTuit Brand Guidelines v1.0 (July 2026)
 * Version: 1.3.0
 *
 * This file intentionally favors stable HighLevel classes/data attributes.
 * HighLevel can change its interface, so test after major platform updates.
 */

@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;700;800&display=swap");

:root {
  --tt-navy-deep: #0b324b;
  --tt-navy: #124663;
  --tt-ink: #12293b;
  --tt-mist: #f5f9fc;
  --tt-white: #ffffff;
  --tt-border: #e3edf3;
  --tt-coral: #f4795a;
  --tt-coral-soft: #fff0eb;
  --tt-amber: #eca83b;
  --tt-amber-soft: #fff7e8;
  --tt-teal: #63c6c3;
  --tt-teal-deep: #297e7b;
  --tt-teal-soft: #e9f8f7;
  --tt-muted: #60788a;
  --tt-radius: 12px;
  --tt-radius-card: 20px;
  --tt-shadow-sm: 0 6px 18px rgba(11, 50, 75, 0.08);
  --tt-shadow-card: 0 12px 32px rgba(11, 50, 75, 0.1);
  --tt-font: "Manrope", sans-serif;
  --tt-mono: "JetBrains Mono", monospace;
  --tt-motion: 0.2s ease;
}

  accent-color: var(--tt-coral);
}

  -webkit-font-smoothing: antialiased;

  background: var(--tt-mist);
  color: var(--tt-ink);
}

#tt-brand-shell {
  align-items: center;
  background: linear-gradient(135deg, var(--tt-navy-deep), var(--tt-navy));
  border: 1px solid rgba(99, 198, 195, 0.38);
  border-radius: 999px;
  box-shadow: 0 10px 28px rgba(11, 50, 75, 0.24);
  color: var(--tt-white);

  font-family: var(--tt-font);
  gap: 9px;
  height: 42px;
  padding: 0 15px 0 11px;
  pointer-events: none;
  position: fixed;
  right: 18px;
  top: 11px;
  z-index: 2147482998;
}

#tt-brand-shell::before {
  background: linear-gradient(
    90deg,
    var(--tt-coral) 0 25%,
    var(--tt-amber) 25% 50%,
    var(--tt-teal) 50% 75%,
    var(--tt-teal-deep) 75% 100%
  );
  content: "";
  height: 4px;
  left: 0;
  pointer-events: none;
  position: fixed;
  right: 0;
  top: 0;
}

  align-items: center;
  display: inline-flex;
}

/* TalkTuit theme control ------------------------------------------------ */

#tt-theme-control {
  bottom: 18px;
  color: var(--tt-ink);
  font-family: var(--tt-font);
  position: fixed;
  right: 18px;
  z-index: 2147483000;
}

#tt-theme-control .tt-theme-trigger {
  align-items: center;
  background: var(--tt-navy-deep);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  box-shadow: 0 14px 34px rgba(11, 50, 75, 0.28);
  color: var(--tt-white);
  cursor: pointer;
  display: flex;
  gap: 9px;
  height: 48px;
  justify-content: flex-start;
  margin-left: auto;
  min-width: 124px;
  padding: 0 15px 0 12px;
  transition:
    box-shadow var(--tt-motion),
    transform var(--tt-motion);
  width: auto;
}

#tt-theme-control .tt-theme-trigger:hover {
  box-shadow: 0 16px 38px rgba(11, 50, 75, 0.34);
  transform: translateY(-2px);
}

#tt-theme-control .tt-theme-trigger__label {
  color: var(--tt-white);
  font-size: 0.73rem;
  font-weight: 800;
  letter-spacing: 0.01em;
  line-height: 1;
  white-space: nowrap;
}

#tt-theme-control
  .tt-theme-trigger[data-tt-active-theme="focus"]
  .tt-theme-trigger__label {
  color: #a8e0de;
}

#tt-theme-control .tt-theme-panel {
  background: var(--tt-white);
  border: 1px solid var(--tt-border);
  border-radius: 18px;
  bottom: 60px;
  box-shadow: 0 18px 46px rgba(11, 50, 75, 0.2);
  min-width: 250px;
  opacity: 0;
  padding: 16px;
  pointer-events: none;
  position: absolute;
  right: 0;
  transform: translateY(8px) scale(0.98);
  transform-origin: bottom right;
  transition:
    opacity var(--tt-motion),
    transform var(--tt-motion);
  visibility: hidden;
}

#tt-theme-control.tt-theme-control--open .tt-theme-panel {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
  visibility: visible;
}

#tt-theme-control .tt-theme-heading {
  color: var(--tt-navy-deep);
  font-size: 0.88rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  margin: 0;
}

#tt-theme-control .tt-theme-copy {
  color: var(--tt-muted);
  font-size: 0.72rem;
  line-height: 1.5;
  margin: 4px 0 12px;
}

#tt-theme-control .tt-theme-options {
  background: var(--tt-mist);
  border: 1px solid var(--tt-border);
  border-radius: 12px;
  display: grid;
  gap: 4px;
  grid-template-columns: 1fr 1fr;
  padding: 4px;
}

#tt-theme-control .tt-theme-option {
  background: transparent;
  border: 0;
  border-radius: 9px;
  color: var(--tt-muted);
  cursor: pointer;
  font-family: var(--tt-font);
  font-size: 0.74rem;
  font-weight: 800;
  padding: 8px 10px;
}

#tt-theme-control .tt-theme-option[aria-pressed="true"] {
  background: var(--tt-white);
  box-shadow: 0 3px 10px rgba(11, 50, 75, 0.1);
  color: var(--tt-navy-deep);
}

.tt-waveform {
  align-items: center;
  display: inline-flex;
  gap: 2px;
  height: 20px;
  justify-content: center;
  width: 25px;
}

.tt-waveform > span {
  border-radius: 99px;
  display: block;
  width: 4px;
}

.tt-waveform > span:nth-child(1) {
  background: var(--tt-coral);
  height: 11px;
}

.tt-waveform > span:nth-child(2) {
  background: var(--tt-amber);
  height: 18px;
}

.tt-waveform > span:nth-child(3) {
  background: var(--tt-teal);
  height: 15px;
}

.tt-waveform > span:nth-child(4) {
  background: var(--tt-teal-deep);
  height: 9px;
}
